[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "code-indexer"
version = "1.0.0"
description = "Production-ready codebase indexing system for RAG and code generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Code Indexer Contributors" }]
keywords = ["rag", "code", "indexing", "tree-sitter", "embeddings", "vector-store"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # AST parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-c>=0.23.0",
    # Core / data models
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Embeddings
    "openai>=1.35",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    # Vector stores
    "chromadb>=0.5",
    "qdrant-client>=1.10",
    # Tokenisation (for token-aware chunking)
    "tiktoken>=0.7",
    "tokenizers>=0.19",
    # CLI
    "click>=8.1",
    "rich>=13.7",
    # Utilities
    "aiofiles>=23.2",
    "chardet>=5.2",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",          # for TestClient
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
ollama = [
    "ollama>=0.2",
]

[project.scripts]
code-indexer = "code_indexer.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=code_indexer --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/code_indexer"]
